<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
          content="width=device-width, initial-scale=1.0">
          
 <title>Create Account | ATM Bank</title>
 
 <link rel="stylesheet" href="style.css">
</head>
<body>

 <div class="auth-page">

        <!-- LEFT SIDE -->
        <div class="brand-section">

            <div class="brand-logo">
                <img src="Screenshot 2026-09-08 201250.png" alt="Bank Logo">
            </div>

            <div class="brand-content">

                <p class="eyebrow">
                    SECURE DIGITAL BANKING
                </p>

                <h1>
                    Banking made
                    <span>simple.</span>
                </h1>

                <p>
                    Create your account and experience
                    secure, simple and smarter banking.
                </p>

            </div>

            <div class="security-note">
                🔒 Your information is securely protected
            </div>

        </div>
        
          <!-- RIGHT SIDE -->
        <div class="form-section">

            <div class="form-container">

                <div class="form-header">

                    <p class="form-label">
                        GET STARTED
                    </p>

                    <h2>
                        Create your account
                    </h2>

                    <p>
                        Enter your details to open your
                        ATM Bank account.
                    </p>

                </div>
                
                <form action="create-account" method="post">

                    <!-- FULL NAME -->

                    <div class="input-group">

                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Enter your full name"
                            required>

                    </div>


                    <!-- PIN -->

                    <div class="input-group">

                        <label for="pin">
                            Create PIN
                        </label>

                        <input
                            type="password"
                            id="pin"
                            name="pin"
                            placeholder="Enter 4-digit PIN"
                            maxlength="4"
                            minlength="4"
                            pattern="[0-9]{4}"
                            required>

                    </div>


                    <!-- CONFIRM PIN -->

                    <div class="input-group">

                        <label for="confirmPin">
                            Confirm PIN
                        </label>

                        <input
                            type="password"
                            id="confirmPin"
                            name="confirmPin"
                            placeholder="Re-enter your PIN"
                            maxlength="4"
                            minlength="4"
                            pattern="[0-9]{4}"
                            required>

                    </div>


                    <!-- INITIAL DEPOSIT -->

                   

                    <!-- SUBMIT BUTTON -->

                    <button
                        type="submit"
                        class="primary-btn">

                        Create Account

                        <span>→</span>

                    </button>

                </form>


                <div class="form-footer">

                    Already have an account?

                    <a href="login.html">
                        Sign in
                    </a>

                </div>

            </div>

        </div>

    </div>

</body>
</html>
