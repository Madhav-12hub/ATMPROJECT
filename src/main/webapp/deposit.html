<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Deposit Money | ATM Bank</title>

    <link rel="stylesheet" href="style.css">

</head>

<body class="login-page">

    <div class="login-container">

        <!-- LEFT SIDE -->

        <div class="login-left">

            <div class="bank-logo">

                <img src="Screenshot 2026-09-08 201250.png"
                     alt="ATM Bank">

            </div>

            <div class="login-content">

                <p class="eyebrow">
                    ATM BANK
                </p>

                <h1>
                    Deposit
                    <br>
                    <span>Money.</span>
                </h1>

                <p class="description">

                    Add money securely to your ATM
                    bank account.

                </p>

            </div>

        </div>


        <!-- RIGHT SIDE -->

        <div class="login-right">

            <div class="login-card">

                <p class="card-eyebrow">
                    ATM SERVICES
                </p>

                <h2>
                    Deposit Money
                </h2>

                <p class="card-description">

                    Enter the amount you want to deposit.

                </p>


                <!-- DEPOSIT FORM -->

                <form action="deposit" method="post">

                    <div class="form-group">

                        <label for="amount">
                            Deposit Amount
                        </label>

                        <input
                            type="number"
                            id="amount"
                            name="amount"
                            placeholder="Enter amount"
                            min="1"
                            step="0.01"
                            required
                        >

                    </div>
                    
                    <div class="form-group">
        <label for="pin">ATM PIN</label>

        <input
            type="password"
            id="pin"
            name="pin"
            placeholder="Enter your 4-digit PIN"
            maxlength="4"
            inputmode="numeric"
            required
        >
    </div>
                    
                    
                    <button
                        type="submit"
                        class="login-button">

                        Deposit

                        <span>→</span>

                    </button>

                </form>


                <div class="signup-link">

                    <a href="dashboard.html">
                        ← Back to Dashboard
                    </a>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
